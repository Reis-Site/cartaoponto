<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal de Ponto - Tempo Real</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .terminal-card {
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 600px;
      text-align: center;
    }
    .posto-tag {
      display: inline-block;
      background: #e2e8f0;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0 0 10px 0;
      color: #1e293b;
      font-size: 26px;
    }
    p.instrucao {
      color: #64748b;
      font-size: 16px;
      margin-bottom: 25px;
    }
    .status-box {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 30px 20px;
      background: #f8fafc;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: all 0.3s ease;
    }
    .status-box.sucesso {
      border-color: #22c55e;
      background: #f0fdf4;
    }
    .nome-colaborador {
      font-size: 24px;
      font-weight: bold;
      color: #15803d;
      margin-bottom: 6px;
    }
    .detalhe-ponto {
      font-size: 16px;
      color: #166534;
    }
    .aguardando-texto {
      font-size: 20px;
      color: #94a3b8;
      font-weight: 500;
    }
    .relogio {
      margin-top: 25px;
      font-size: 22px;
      color: #64748b;
      font-family: monospace;
      font-weight: bold;
    }
    .pulso-ativo {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #22c55e;
      border-radius: 50%;
      margin-right: 6px;
    }
  </style>
</head>
<body>

<div class="terminal-card">
  <div class="posto-tag">
    <span class="pulso-ativo"></span> Terminal Conectado
  </div>

  <h1>Registro de Ponto</h1>
  <p class="instrucao">Aproxime o cartão na leitora</p>

  <!-- Painel que atualiza em tempo real -->
  <div id="painelStatus" class="status-box">
    <div id="conteudoStatus" class="aguardando-texto">Aguardando aproximação do crachá...</div>
  </div>

  <div class="relogio" id="txtRelogio">--:--:--</div>
</div>

<script>
  const URL_API = "https://script.google.com/macros/s/AKfycbyWRyOr7AhYSSOTMxTIOP-HKioX5xkIYwN-Yhv_gVBVlu0wqsAgP-boDxhr_v7n_Ei1uw/exec";

  let ultimaHoraBatida = null;
  let temporizadorLimpeza = null;

  window.addEventListener('load', () => {
    iniciarRelogio();
    // Consulta a planilha a cada 2 segundos para checar novas batidas do Python
    setInterval(verificarNovasBatidas, 2000);
  });

  async function verificarNovasBatidas() {
    try {
      const resp = await fetch(`${URL_API}?acao=relatorioHoje`);
      const registros = await resp.json();

      if (!registros || registros.length === 0) return;

      // O primeiro elemento do array é a batida mais recente
      const ultimaBatida = registros[0];
      const identificadorBatida = `${ultimaBatida.matricula}_${ultimaBatida.hora}`;

      // Na primeira execução após abrir a página, apenas memoriza o último registro
      if (ultimaHoraBatida === null) {
        ultimaHoraBatida = identificadorBatida;
        return;
      }

      // Se houver uma nova batida gravada pelo Python
      if (identificadorBatida !== ultimaHoraBatida) {
        ultimaHoraBatida = identificadorBatida;
        exibirPontoTempoReal(ultimaBatida);
      }
    } catch (e) {
      // Falha temporária de rede, continuará tentando no próximo ciclo
    }
  }

  function exibirPontoTempoReal(batida) {
    const painel = document.getElementById('painelStatus');
    const conteudo = document.getElementById('conteudoStatus');

    if (temporizadorLimpeza) clearTimeout(temporizadorLimpeza);

    painel.classList.add('sucesso');
    conteudo.innerHTML = `
      <div class="nome-colaborador">${batida.nome}</div>
      <div class="detalhe-ponto">Ponto gravado às <strong>${batida.hora}</strong> (${batida.status})</div>
    `;

    // Apaga a mensagem após 5 segundos e volta ao estado de espera
    temporizadorLimpeza = setTimeout(() => {
      painel.classList.remove('sucesso');
      conteudo.className = "aguardando-texto";
      conteudo.innerHTML = "Aguardando aproximação do crachá...";
    }, 5000);
  }

  function iniciarRelogio() {
    setInterval(() => {
      const agora = new Date();
      document.getElementById('txtRelogio').innerText = agora.toLocaleTimeString('pt-BR');
    }, 1000);
  }
</script>

</body>
</html>
