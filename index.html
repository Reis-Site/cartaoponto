<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal de Ponto</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .terminal-card {
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 580px;
      text-align: center;
    }
    .posto-selector {
      margin-bottom: 25px;
      text-align: right;
    }
    .posto-selector select {
      padding: 6px 12px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      font-weight: 600;
    }
    h1 {
      margin: 0 0 10px 0;
      color: #1e293b;
      font-size: 26px;
    }
    p.instrucao {
      color: #64748b;
      font-size: 16px;
      margin-bottom: 30px;
    }
    #campoCartao {
      font-size: 30px;
      letter-spacing: 2px;
      text-align: center;
      padding: 14px 20px;
      width: 100%;
      max-width: 360px;
      border: 3px solid #2563eb;
      border-radius: 10px;
      outline: none;
      background: #f8fafc;
      margin-bottom: 20px;
    }
    .alerta {
      font-size: 17px;
      font-weight: 700;
      min-height: 48px;
      padding: 10px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      opacity: 0;
    }
    .alerta.visivel { opacity: 1; }
    .alerta-ok { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    .alerta-erro { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
    .alerta-info { background: #dbeafe; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .relogio {
      margin-top: 25px;
      font-size: 20px;
      color: #94a3b8;
      font-family: monospace;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="terminal-card">
  <div class="posto-selector">
    <label for="postoAcesso"><strong>Posto: </strong></label>
    <select id="postoAcesso">
      <option value="Terminal">Terminal</option>
      <option value="Garagem Sul">Garagem Sul</option>
    </select>
  </div>

  <h1>Registro de Ponto</h1>
  <p class="instrucao">Aproxime o cartão na leitora</p>

  <input type="text" id="campoCartao" autofocus autocomplete="off" placeholder="Aguardando...">

  <div id="boxAlerta" class="alerta"></div>

  <div class="relogio" id="txtRelogio">--:--:--</div>
</div>

<script>
  const URL_API = "https://script.google.com/macros/s/AKfycbyWRyOr7AhYSSOTMxTIOP-HKioX5xkIYwN-Yhv_gVBVlu0wqsAgP-boDxhr_v7n_Ei1uw/exec";

  const campo = document.getElementById('campoCartao');
  const alerta = document.getElementById('boxAlerta');
  const posto = document.getElementById('postoAcesso');
  let temporizadorMensagem = null;

  function manterFoco() {
    campo.focus();
  }
  document.addEventListener('click', manterFoco);
  window.addEventListener('load', () => {
    manterFoco();
    iniciarRelogio();
  });

  function exibirMensagem(texto, tipo, duracaoMs = 5000) {
    if (temporizadorMensagem) clearTimeout(temporizadorMensagem);

    alerta.className = `alerta visivel alerta-${tipo}`;
    alerta.innerText = texto;

    temporizadorMensagem = setTimeout(() => {
      alerta.className = "alerta";
      alerta.innerText = "";
    }, duracaoMs);
  }

  campo.addEventListener('keydown', async function(e) {
    if (e.key === 'Enter') {
      const matricula = campo.value.trim();
      if (!matricula) return;

      exibirMensagem("Gravando marcação...", "info", 10000);

      try {
        const resp = await fetch(URL_API, {
          method: 'POST',
          body: JSON.stringify({
            matricula: matricula,
            local: posto.value
          })
        });

        const dados = await resp.json();

        if (dados.sucesso) {
          exibirMensagem(`Ponto de ${dados.nome} gravado com sucesso! (${dados.status})`, "ok", 5000);
        } else {
          exibirMensagem(`Atenção: ${dados.mensagem}`, "erro", 6000);
        }
      } catch (err) {
        exibirMensagem("Erro de comunicação com o servidor de ponto.", "erro", 5000);
      } finally {
        campo.value = '';
        manterFoco();
      }
    }
  });

  function iniciarRelogio() {
    setInterval(() => {
      const agora = new Date();
      document.getElementById('txtRelogio').innerText = agora.toLocaleTimeString('pt-BR');
    }, 1000);
  }
</script>

</body>
</html>
